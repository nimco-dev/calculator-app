<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Animated Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
        <div class="display">
            <input type="text" id="screen" readonly placeholder="0">
        </div>
        <div class="buttons">
            <button class="btn special" onclick="clearScreen()">AC</button>
            <button class="btn special" onclick="deleteLast()">DEL</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>
            
            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>
            
            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>
            
            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn equal" onclick="calculate()">=</button>
            
            <button class="btn zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
        </div>
    </div>

    <script>
        let screen = document.getElementById('screen');

        function appendValue(value) {
            if (screen.value === "0" || screen.value === "Error") screen.value = "";
            screen.value += value;
        }

        function clearScreen() {
            screen.value = "";
        }

        function deleteLast() {
            screen.value = screen.value.slice(0, -1);
        }

        function calculate() {
            try {
                if(screen.value !== "") {
                    screen.value = eval(screen.value);
                }
            } catch (error) {
                screen.value = "Error";
                setTimeout(clearScreen, 1500);
            }
        }
    </script>
</body>
</html>
